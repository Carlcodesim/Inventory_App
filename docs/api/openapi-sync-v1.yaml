openapi: 3.1.0
info:
  title: Inventory_App Sync API
  version: 1.0.0
  description: Contrato inicial de sincronización LAN entre el panel web de Windows y Android.
servers:
  - url: http://{pcHost}:{port}/api/v1
    variables:
      pcHost:
        default: 192.168.1.10
      port:
        default: "8787"
security:
  - DeviceBearer: []
paths:
  /health:
    get:
      security: []
      summary: Estado del servidor
      responses:
        "200":
          description: Servidor disponible
  /pairing/exchange:
    post:
      security: []
      summary: Canjear código temporal de emparejamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceId, deviceName]
              properties:
                pairingCode: { type: string, pattern: "^[a-f0-9]{20}$", description: "Código hexadecimal de un solo uso generado en el servidor; vence en cinco minutos." }
                deviceId: { type: string, format: uuid }
                deviceName: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Dispositivo autorizado; el accessToken se muestra una sola vez y debe guardarse de forma segura en Android
        "401":
          description: Código inválido, vencido o ya utilizado
  /bootstrap:
    get:
      summary: Estado inicial para un dispositivo nuevo
      responses:
        "200":
          description: Datos iniciales y cursor de sincronización
  /server-info:
    get:
      security: []
      summary: Direcciones LAN del servidor
      responses:
        "200":
          description: Direcciones IPv4 disponibles y puerto
  /stores:
    get:
      summary: Listar sucursales activas
      responses:
        "200":
          description: Lista de sucursales
    post:
      summary: Crear sucursal
      responses:
        "201":
          description: Sucursal creada
  /catalog:
    get:
      summary: Listar categorías y proveedores
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [CATEGORY, SUPPLIER] }
      responses:
        "200":
          description: Elementos activos del catálogo
    post:
      summary: Crear o reactivar categoría/proveedor
      responses:
        "200":
          description: Elemento existente reactivado
        "201":
          description: Elemento creado
  /products:
    get:
      summary: Listar productos
      parameters:
        - in: query
          name: storeSyncId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Productos activos
    post:
      summary: Crear producto
      description: Los importes se envían como enteros en centavos DOP.
      responses:
        "201":
          description: Producto creado
  /stores/{syncId}:
    parameters:
      - in: path
        name: syncId
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Actualizar campos de una sucursal
      description: Incrementa version y publica un evento upsert.
      responses:
        "200": { description: Sucursal actualizada }
        "400": { description: Datos inválidos }
        "404": { description: Sucursal inexistente o eliminada }
    delete:
      summary: Eliminar lógicamente una sucursal
      description: Solo permite eliminar sucursales sin productos activos. Conserva el registro y su historial.
      responses:
        "200": { description: Sucursal marcada como eliminada }
        "404": { description: Sucursal inexistente o eliminada }
        "409": { description: La sucursal todavía tiene productos activos }
  /catalog/{syncId}:
    parameters:
      - in: path
        name: syncId
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Renombrar una categoría o proveedor
      responses:
        "200": { description: Elemento actualizado }
        "409": { description: Ya existe un elemento con ese nombre y tipo }
    delete:
      summary: Eliminar lógicamente una categoría o proveedor
      description: No permite eliminar elementos utilizados por productos activos.
      responses:
        "200": { description: Elemento marcado como eliminado }
        "409": { description: Elemento utilizado por productos activos }
  /products/{syncId}:
    parameters:
      - in: path
        name: syncId
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Actualizar datos de un producto
      description: No permite modificar stock ni sucursal; el stock solo cambia mediante operaciones de inventario.
      responses:
        "200": { description: Producto actualizado }
        "400": { description: Datos inválidos o sin campos actualizables }
        "404": { description: Producto inexistente o eliminado }
    delete:
      summary: Eliminar lógicamente un producto
      description: Solo permite eliminar productos con stock exactamente igual a cero. Ventas y movimientos históricos se conservan.
      responses:
        "200": { description: Producto marcado como eliminado }
        "404": { description: Producto inexistente o eliminado }
        "409": { description: El producto todavía tiene existencias }
  /sales:
    get:
      summary: Consultar historial reciente de ventas
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Ventas recientes ordenadas de más nueva a más antigua
        "400":
          description: Límite inválido
  /sync/changes:
    get:
      summary: Descargar cambios posteriores al cursor
      parameters:
        - in: query
          name: cursor
          required: true
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Lote ordenado de cambios y nuevo cursor
  /sync/operations:
    post:
      summary: Procesar ventas y ajustes de inventario de forma idempotente
      description: El dispositivo se identifica por Bearer token. Cada operación se confirma en su propia transacción; repetir operationId desde el mismo dispositivo devuelve el recibo previo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [operationId, type, payload]
                    properties:
                      operationId: { type: string, format: uuid }
                      type: { type: string, enum: [sale.create, stock.adjust] }
                      payload:
                        type: object
                        description: Para sale.create requiere storeSyncId, productSyncId y quantity. Para stock.adjust requiere storeSyncId, productSyncId, delta y reason.
                        additionalProperties: true
      responses:
        "200":
          description: Resultado por operación; comprobar status applied o rejected
        "401":
          description: Dispositivo no autorizado
        "409":
          description: Conflicto de identificador o regla de inventario
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
